<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Acessível POLI - UPE</title>

    <!-- CSS do Leaflet (Biblioteca do Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Nosso arquivo de estilo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Cabeçalho Acessível -->
<header class="cabecalho">
    <h1>📍 Mapa Acessível POLI</h1>
    <!-- Esta mensagem muda dinamicamente dependendo do QR Code escaneado -->
    <p id="status-local">Aguardando identificação de local...</p>
</header>

<!-- Painel de Controles e Seleção de Rota -->
<main class="container-principal">
    <section class="painel-rotas">
        <label for="select-destino">Para onde você deseja ir?</label>
        <select id="select-destino">
            <option value="">-- Selecione o Destino --</option>
            <option value="entrada">🚪 Entrada Principal</option>
            <option value="bloco_a">🏢 Bloco A (Auditório / NAPSI / LIP 4)</option>
            <option value="biblioteca">📚 Biblioteca (LIP 3)</option>
            <option value="bloco_b">🏢 Bloco B (Tesouraria / Escolaridade / Protocolo)</option>
            <option value="bloco_c">🏢 Bloco C (ECOMP)</option>
            <option value="bloco_d">🏢 Bloco D</option>
            <option value="bloco_e">🏢 Bloco E / DEX</option>
            <option value="bloco_f">🏢 Bloco F (LIP 1 / LIP 2)</option>
            <option value="bloco_g">🏢 Bloco G (LIP 7)</option>
            <option value="bloco_i">🏢 Bloco I (DATP)</option>
            <option value="bloco_j">🏢 Bloco J (LIP 5 / LIP 6)</option>
            <option value="bloco_k">🏢 Bloco K</option>
            <option value="quadra">⚽Estacionamento</option>
            <option value="praca">🌳 Praça Central</option>
        </select>
        <button id="btn-tracar-rota">Traçar Rota Visual</button>
    </section>

    <!-- Espaço onde o mapa interativo é renderizado -->
    <div id="mapa"></div>
</main>

<!-- JS do Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Nosso arquivo de lógica JavaScript -->
<script src="js/mapa.js"></script>
</body>
</html>
